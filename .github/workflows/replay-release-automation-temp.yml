name: Temporary Release Automation Replay

on:
  pull_request:
    branches:
      - foundation/release-baseline

permissions:
  contents: write

jobs:
  replay:
    if: >-
      github.head_ref == 'foundation/release-automation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Replay audited automation files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin foundation/release-automation-snapshot
          git checkout FETCH_HEAD -- package.json tools/check-release-contract.mjs
          rm .github/workflows/replay-release-automation-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json tools/check-release-contract.mjs .github/workflows/replay-release-automation-temp.yml
          git diff --cached --check
          git commit -m 'test(release): enforce version and toolchain invariants'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
