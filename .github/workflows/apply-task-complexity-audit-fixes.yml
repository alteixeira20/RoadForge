name: Apply task complexity audit fixes

on:
  push:
    branches:
      - feature/task-complexity
    paths:
      - .github/workflows/apply-task-complexity-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/task-complexity
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python tools/apply-task-complexity-audit-fixes.py
          git diff --check
          git status --short
          git config user.name "RoadForge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(tasks): complete complexity partial-write contract"
          git push origin HEAD:feature/task-complexity
