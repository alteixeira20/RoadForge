name: Apply task complexity feature

on:
  push:
    branches:
      - feature/task-complexity
    paths:
      - .github/workflows/apply-task-complexity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/task-complexity
          fetch-depth: 0

      - name: Apply task complexity feature
        shell: bash
        run: |
          python tools/apply-task-complexity.py
          git diff --check
          git status --short
          git config user.name "RoadForge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(tasks): add complexity and decomposition rules"
          git push origin HEAD:feature/task-complexity
