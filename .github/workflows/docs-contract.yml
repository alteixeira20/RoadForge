name: Documentation Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - 'docs/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tools/check-product-copy.mjs'
      - 'tools/check-doc-links.mjs'
      - 'tools/check-issue-forms.mjs'
      - '.github/workflows/docs-contract.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'GOVERNANCE.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - 'docs/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tools/check-product-copy.mjs'
      - 'tools/check-doc-links.mjs'
      - 'tools/check-issue-forms.mjs'
      - '.github/workflows/docs-contract.yml'

permissions:
  contents: read

concurrency:
  group: docs-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Docs, Copy & Contribution Forms
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation links
        run: pnpm check:docs

      - name: Validate product copy contract
        run: pnpm check:copy

      - name: Validate issue forms
        run: pnpm check:issues

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
