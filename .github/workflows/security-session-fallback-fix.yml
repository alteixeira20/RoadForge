name: Apply exact browser-session fallback migration

on:
  push:
    branches:
      - security/internet-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin refs/heads/security/internet-hardening
          git checkout -B security/internet-hardening FETCH_HEAD

      - name: Apply exact service transformations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {text.count(old)}")
              p.write_text(text.replace(old, new))

          replace_once(
              'apps/web/src/services/roadmap-crud.service.ts',
              "import { BROWSER_SESSION_TOKEN, establishBrowserSession, requestJson } from './roadmap-http'",
              "import { requestJson, resolveBrowserSessionToken } from './roadmap-http'",
          )
          replace_once(
              'apps/web/src/services/roadmap-crud.service.ts',
              "  await establishBrowserSession(data.id, data.owner_session_token)\n  return {\n",
              "  const browserSessionToken = await resolveBrowserSessionToken(\n    data.id,\n    data.owner_session_token,\n  )\n  return {\n",
          )
          replace_once(
              'apps/web/src/services/roadmap-crud.service.ts',
              "    ownerSessionToken: BROWSER_SESSION_TOKEN,\n",
              "    ownerSessionToken: browserSessionToken,\n",
          )

          replace_once(
              'apps/web/src/services/roadmap-sharing.service.ts',
              "import { BROWSER_SESSION_TOKEN, establishBrowserSession, requestJson } from './roadmap-http'",
              "import { requestJson, resolveBrowserSessionToken } from './roadmap-http'",
          )
          replace_once(
              'apps/web/src/services/roadmap-sharing.service.ts',
              "  await establishBrowserSession(data.roadmap_id, data.session_token)\n  return {\n",
              "  const browserSessionToken = await resolveBrowserSessionToken(\n    data.roadmap_id,\n    data.session_token,\n  )\n  return {\n",
          )
          replace_once(
              'apps/web/src/services/roadmap-sharing.service.ts',
              "    sessionToken: BROWSER_SESSION_TOKEN,\n",
              "    sessionToken: browserSessionToken,\n",
          )
          PY
          git diff --check

      - name: Commit and self-delete workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/workflows/security-session-fallback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): preserve session recovery on cookie exchange failure"
          git push origin HEAD:refs/heads/security/internet-hardening
