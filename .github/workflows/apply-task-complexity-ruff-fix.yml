name: Apply task complexity Ruff fix

on:
  push:
    branches:
      - feature/task-complexity
    paths:
      - .github/workflows/apply-task-complexity-ruff-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/task-complexity
          fetch-depth: 0
      - name: Apply fix
        shell: bash
        run: |
          python tools/fix-task-complexity-ruff.py
          git diff --check
          git config user.name "RoadForge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): wrap complexity validation messages"
          git push origin HEAD:feature/task-complexity
