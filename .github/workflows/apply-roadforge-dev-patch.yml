name: Apply RoadForge dev patch

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-roadforge-dev-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-roadforge-dev-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply atomic patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/roadforge-dev-patch.a* | base64 --decode > /tmp/roadforge-dev.patch
          git apply --check /tmp/roadforge-dev.patch
          git apply /tmp/roadforge-dev.patch
          rm -f .github/roadforge-dev-patch.a* .github/workflows/apply-roadforge-dev-patch.yml
          git config user.name "RoadForge CI"
          git config user.email "roadforge-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make RoadForge agent-ready and projection-safe"
          git push origin HEAD:dev
