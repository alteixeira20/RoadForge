name: Apply security re-audit fixes

on:
  push:
    branches:
      - security/post-hardening-audit-2026-08-12
    paths:
      - .github/workflows/apply-security-reaudit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: security/post-hardening-audit-2026-08-12
          fetch-depth: 0
      - name: Finalize candidate
        shell: bash
        run: |
          python tools/finalize-security-reaudit.py
          pip install -e "apps/api[dev]" -q
          ruff check apps/api/src --fix
          ruff check apps/api/unit_tests/test_realtime_resource_limits.py --fix
          ruff check apps/api/unit_tests/test_production_origin_security.py --fix
          ruff check apps/api/tests/test_security_resource_limits.py --fix
          ruff check apps/api/src
          ruff check apps/api/unit_tests/test_realtime_resource_limits.py
          ruff check apps/api/unit_tests/test_production_origin_security.py
          ruff check apps/api/tests/test_security_resource_limits.py
          python -m compileall -q apps/api/src/api apps/api/tests apps/api/unit_tests
          git diff --check
          git status --short
          git config user.name "RoadForge Security Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(security): lock post-hardening audit contract"
          git push origin HEAD:security/post-hardening-audit-2026-08-12
