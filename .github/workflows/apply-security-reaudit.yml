name: Apply security re-audit fixes

on:
  push:
    branches:
      - security/post-hardening-audit-2026-08-12
    paths:
      - .github/workflows/apply-security-reaudit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: security/post-hardening-audit-2026-08-12
          fetch-depth: 0
      - name: Apply correctness polish
        shell: bash
        run: |
          python tools/polish-security-reaudit.py
          python -m compileall -q apps/api/src/api
          git diff --check
          git status --short
          git config user.name "RoadForge Security Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): preserve transaction and auth invariants"
          git push origin HEAD:security/post-hardening-audit-2026-08-12
