name: Temporary Retention Ruff Fix

on:
  pull_request:
    branches:
      - foundation/python-lock

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.head_ref == 'foundation/data-retention' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply ruff fix to retention service only
        working-directory: apps/api
        run: |
          set -euo pipefail
          bash scripts/sync-locked-env.sh dev
          uv run --no-sync ruff check src/api/services/retention_service.py --fix
          uv run --no-sync ruff check src/api/services/retention_service.py
      - name: Commit only the formatter result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/api/services/retention_service.py
          if git diff --cached --quiet; then
            echo 'No formatter change required.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'style(api): apply canonical retention import order'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
