name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN ONE_SHOT_PROJECTION_APPLY
  apply-projection-final:
    name: Apply Final Projection Update
    if: github.event_name == 'pull_request' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply clean projection update
        shell: bash
        run: |
          set -euo pipefail
          cat .github/projection-upsert.a* | base64 --decode > /tmp/projection-upsert.patch
          awk '
            /^diff --git a\/apps\/api\/tests\/test_roadmap_projection_parity.py / { exit }
            { print }
          ' /tmp/projection-upsert.patch > /tmp/projection-service.patch
          git apply --3way /tmp/projection-service.patch
          python -c "import base64; exec(base64.b64decode(''))"
          rm -f \
            .github/projection-upsert.a* \
            .github/projection-upsert.trigger \
            .github/workflows/apply-projection-upsert.yml \
            .github/workflows/apply-projection-final.yml
          git config user.name "RoadForge CI"
          git config user.email "roadforge-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(api): preserve projection rows across full saves"
          git push origin HEAD:dev
  # END ONE_SHOT_PROJECTION_APPLY

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation gate
        run: make check

  mcp:
    name: MCP Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate stdio package
        working-directory: packages/roadforge-mcp
        run: npm run check

  api-lint:
    name: API Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API with dev extras
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Run ruff
        working-directory: apps/api
        run: ruff check src/

  api-syntax:
    name: API Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q apps/api/src

  migration-check:
    name: Migration / Schema Drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roadforge
          POSTGRES_PASSWORD: roadforge
          POSTGRES_DB: roadforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e .

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://roadforge:roadforge@localhost:5432/roadforge
        run: alembic upgrade head

      - name: Check for ORM/migration drift
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://roadforge:roadforge@localhost:5432/roadforge
        run: alembic check

  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roadforge
          POSTGRES_PASSWORD: roadforge
          POSTGRES_DB: roadforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API with test extras
        working-directory: apps/api
        run: pip install -e ".[test]"

      - name: Run pytest
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://roadforge:roadforge@localhost:5432/roadforge_test
        run: python3 -m pytest -q --junitxml=pytest-report.xml

      - name: Upload API test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-report
          path: apps/api/pytest-report.xml
          if-no-files-found: error
          retention-days: 7

  container-build:
    name: Production Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --pull -t roadforge-api:ci apps/api

      - name: Build web image
        run: docker build --pull -f apps/web/Dockerfile -t roadforge-web:ci .

      - name: Verify API runs as non-root
        run: |
          test "$(docker image inspect roadforge-api:ci --format '{{.Config.User}}')" = "roadforge"

  js-audit:
    name: JS Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS audit (high+ severity)
        run: pnpm audit --audit-level high --prod

  api-audit:
    name: API Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API with audit extras
        run: pip install -e "apps/api[audit]" -q

      - name: Run Python audit
        run: make api-audit

  web-unit:
    name: Web Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm --dir apps/web test

  web-browser-smoke:
    name: Web Browser Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run focused browser smoke
        run: pnpm --dir apps/web test:browser

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
