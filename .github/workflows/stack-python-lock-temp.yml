name: Temporary Python Lock Stack

on:
  pull_request:
    branches:
      - dev
      - foundation/release-baseline

permissions:
  contents: write

jobs:
  stack:
    if: >-
      github.head_ref == 'foundation/python-lock' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge the exact green release baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin foundation/release-baseline

          set +e
          git merge --no-ff --no-commit origin/foundation/release-baseline
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts: %s\n' "${conflicts[*]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != 'docs/security/dependency-audit-policy.md' ]; then
              echo 'Unexpected conflict set; aborting instead of guessing.' >&2
              git merge --abort || true
              exit 1
            fi
            git checkout --theirs docs/security/dependency-audit-policy.md
            python - <<'PY'
            from pathlib import Path
            path = Path('docs/security/dependency-audit-policy.md')
            lines = path.read_text().splitlines()
            path.write_text('\n'.join(line.rstrip() for line in lines) + '\n')
            PY
            git add docs/security/dependency-audit-policy.md
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/stack-python-lock-temp.yml
          git add .github/workflows/stack-python-lock-temp.yml
          git diff --cached --check
          git commit -m 'chore: stack Python lock foundation on release baseline'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
