name: Temporary API Lock Generator

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  generate-and-commit-lock:
    if: >-
      github.head_ref == 'foundation/python-lock' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Generate lock
        working-directory: apps/api
        run: uv lock --python 3.12
      - name: Commit lock and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/generate-api-lock-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/uv.lock .github/workflows/generate-api-lock-temp.yml
          git diff --cached --exit-code && {
            echo 'Expected generated lock/workflow changes were not present.' >&2
            exit 1
          }
          git commit -m 'chore(api): commit generated uv dependency lock'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
