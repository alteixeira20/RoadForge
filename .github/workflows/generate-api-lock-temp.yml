name: Temporary API Lock Generator

on:
  push:
    branches:
      - foundation/python-lock

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Generate lock
        working-directory: apps/api
        run: uv lock --python 3.12
      - name: Emit compressed lock for maintainer capture
        working-directory: apps/api
        shell: bash
        run: |
          printf 'UVLOCK_GZIP_BASE64='
          gzip -9 -c uv.lock | base64 -w0
          printf '\n'
