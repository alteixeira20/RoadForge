name: Temporary API Lock Generator

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Generate lock
        working-directory: apps/api
        run: uv lock --python 3.12
      - name: Upload generated lock
        uses: actions/upload-artifact@v6
        with:
          name: roadforge-api-uv-lock
          path: apps/api/uv.lock
          if-no-files-found: error
          retention-days: 1
