from urllib.parse import urlparse

import pytest
from httpx import AsyncClient
from redis.exceptions import RedisError

from api.services.rate_limit_service import RedisRateLimiter
from tests.conftest import create_roadmap

pytestmark = pytest.mark.asyncio

_ALLOWED_ORIGIN = "http://localhost:3020"
_COOKIE_MODE = {"X-RoadForge-Session-Mode": "cookie"}


def _auth(token: str) -> dict[str, str]:
    return {"Authorization": f"Bearer {token}"}


def _invite_token(url: str) -> str:
    fragment = urlparse(url).fragment
    assert fragment.startswith("token=")
    return fragment.removeprefix("token=")


async def test_create_cookie_mode_never_returns_raw_owner_token(client: AsyncClient):
    response = await client.post(
        "/api/roadmaps",
        headers=_COOKIE_MODE,
        json={"name": "Cookie roadmap", "owner_display_name": "Owner", "phases": []},
    )
    assert response.status_code == 201, response.text
    body = response.json()
    assert body["owner_session_token"] is None
    cookie = response.headers.get("set-cookie", "")
    assert "roadforge_session=" in cookie
    assert "HttpOnly" in cookie
    assert "SameSite=strict" in cookie
    assert f"Path=/api/roadmaps/{body['id']}" in cookie
    assert response.headers["cache-control"] == "no-store"

    # The client cookie jar now authenticates reads without JavaScript-readable credentials.
    read = await client.get(f"/api/roadmaps/{body['id']}")
    assert read.status_code == 200, read.text


async def test_cookie_authenticated_write_requires_allowed_origin(client: AsyncClient):
    response = await client.post(
        "/api/roadmaps",
        headers=_COOKIE_MODE,
        json={"name": "CSRF protected", "owner_display_name": "Owner", "phases": []},
    )
    roadmap_id = response.json()["id"]
    updated_at = response.json()["updated_at"]

    rejected = await client.put(
        f"/api/roadmaps/{roadmap_id}",
        json={"name": "Rejected", "last_updated_at": updated_at},
    )
    assert rejected.status_code == 403
    assert rejected.json()["detail"] == "Invalid request origin"

    accepted = await client.put(
        f"/api/roadmaps/{roadmap_id}",
        headers={"Origin": _ALLOWED_ORIGIN},
        json={"name": "Accepted", "last_updated_at": updated_at},
    )
    assert accepted.status_code == 200, accepted.text


async def test_legacy_bearer_session_can_bootstrap_http_only_cookie(client: AsyncClient):
    body = await create_roadmap(client)
    roadmap_id = body["id"]
    owner_token = body["owner_session_token"]

    migrated = await client.post(
        f"/api/roadmaps/{roadmap_id}/session/cookie",
        headers=_auth(owner_token),
    )
    assert migrated.status_code == 204, migrated.text
    cookie = migrated.headers.get("set-cookie", "")
    assert "roadforge_session=" in cookie and "HttpOnly" in cookie

    read = await client.get(f"/api/roadmaps/{roadmap_id}")
    assert read.status_code == 200, read.text


async def test_join_cookie_mode_returns_no_raw_session(client: AsyncClient):
    body = await create_roadmap(client)
    roadmap_id = body["id"]
    owner_token = body["owner_session_token"]
    rotated = await client.post(
        f"/api/roadmaps/{roadmap_id}/share-links/editor/rotate",
        headers=_auth(owner_token),
    )
    invite = _invite_token(rotated.json()["url"])

    # Clear the owner's path-scoped cookie if a test client implementation retained one.
    client.cookies.clear()
    joined = await client.post(
        "/api/roadmaps/join",
        headers=_COOKIE_MODE,
        json={"token": invite, "display_name": "Editor"},
    )
    assert joined.status_code == 200, joined.text
    assert joined.json()["session_token"] is None
    assert "roadforge_session=" in joined.headers.get("set-cookie", "")

    read = await client.get(f"/api/roadmaps/{roadmap_id}")
    assert read.status_code == 200, read.text


async def test_redis_rate_limiter_fails_closed(monkeypatch):
    limiter = RedisRateLimiter(
        redis_url="redis://localhost:6379/0",
        key_prefix="test",
        connect_timeout_seconds=0.1,
        socket_timeout_seconds=0.1,
    )

    async def broken_eval(*args, **kwargs):
        raise RedisError("down")

    monkeypatch.setattr(limiter._redis, "eval", broken_eval)
    with pytest.raises(Exception) as exc_info:
        await limiter.check("join.ip", "127.0.0.1", 20, 60)
    exc = exc_info.value
    assert getattr(exc, "status_code", None) == 503
    assert getattr(exc, "detail", None) == "Rate limiter temporarily unavailable"
''')

