name: Apply Phase 2 application hardening

on:
  push:
    branches:
      - security/internet-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(security): bootstrap phase 2 application hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin refs/heads/security/internet-hardening
          git checkout -B security/internet-hardening FETCH_HEAD

      - name: Apply application hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual} for {old[:80]!r}")
              p.write_text(text.replace(old, new))

