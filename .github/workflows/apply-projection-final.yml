name: Apply final projection update

# One-shot push workflow. It deletes itself after a successful application.
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-projection-final.yml

permissions:
  contents: write

concurrency:
  group: apply-final-projection-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply clean projection update
        shell: bash
        run: |
          set -euo pipefail
          cat .github/projection-upsert.a* | base64 --decode > /tmp/projection-upsert.patch
          awk '
            /^diff --git a\/apps\/api\/tests\/test_roadmap_projection_parity.py / { exit }
            { print }
          ' /tmp/projection-upsert.patch > /tmp/projection-service.patch
          git apply --3way /tmp/projection-service.patch

          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/test_roadmap_projection_parity.py")
          text = path.read_text()
          replacements = [
              (
                  "from api.models.roadmap import Roadmap, RoadmapTask",
                  "from api.models.roadmap import Roadmap, RoadmapPhase, RoadmapTask",
              ),
              (
                  '''    owner_token = body["owner_session_token"]

    new_phases = [''',
                  '''    owner_token = body["owner_session_token"]

    original_phase = await db_session.scalar(
        select(RoadmapPhase).where(
            RoadmapPhase.roadmap_id == roadmap_id,
            RoadmapPhase.client_phase_id == "ph_a",
        )
    )
    original_task = await db_session.scalar(
        select(RoadmapTask).where(
            RoadmapTask.roadmap_id == roadmap_id,
            RoadmapTask.client_task_id == "tk_a1",
        )
    )
    assert original_phase is not None and original_task is not None
    original_phase_row_id = original_phase.id
    original_task_row_id = original_task.id

    new_phases = [''',
              ),
              (
                  '''    assert parity.phase_count_snapshot == 1
    assert parity.task_count_snapshot == 2


# ─── Group G''',
                  '''    assert parity.phase_count_snapshot == 1
    assert parity.task_count_snapshot == 2

    retained_phase = await db_session.scalar(
        select(RoadmapPhase).where(
            RoadmapPhase.roadmap_id == roadmap_id,
            RoadmapPhase.client_phase_id == "ph_a",
        )
    )
    retained_task = await db_session.scalar(
        select(RoadmapTask).where(
            RoadmapTask.roadmap_id == roadmap_id,
            RoadmapTask.client_task_id == "tk_a1",
        )
    )
    assert retained_phase is not None and retained_phase.id == original_phase_row_id
    assert retained_task is not None and retained_task.id == original_task_row_id


# ─── Group G''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected parity test marker: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm -f \
            .github/projection-upsert.a* \
            .github/projection-upsert.trigger \
            .github/workflows/apply-projection-upsert.yml \
            .github/workflows/apply-projection-final.yml
          git config user.name "RoadForge CI"
          git config user.email "roadforge-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(api): preserve projection rows across full saves"
          git push origin HEAD:dev
