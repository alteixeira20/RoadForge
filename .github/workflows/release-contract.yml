name: Release Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'apps/web/package.json'
      - 'packages/roadforge-mcp/package.json'
      - 'apps/api/src/api/config.py'
      - 'CHANGELOG.md'
      - 'Makefile'
      - '.nvmrc'
      - 'tools/check-release-contract.mjs'
      - '.github/workflows/release-contract.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'package.json'
      - 'apps/web/package.json'
      - 'packages/roadforge-mcp/package.json'
      - 'apps/api/src/api/config.py'
      - 'CHANGELOG.md'
      - 'Makefile'
      - '.nvmrc'
      - 'tools/check-release-contract.mjs'
      - '.github/workflows/release-contract.yml'

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Version & Toolchain Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release invariants
        run: pnpm check:release
