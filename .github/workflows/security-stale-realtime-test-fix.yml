name: Apply exact realtime test migration

on:
  push:
    branches:
      - security/internet-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch without third-party actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin refs/heads/security/internet-hardening
          git checkout -B security/internet-hardening FETCH_HEAD

      - name: Replace only stale ticket assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/tests/test_realtime_revocation.py')
          text = path.read_text()
          raw_read = '    ticket = ticket_resp.json()["ticket"]\n'
          query_use = ', params={"ticket": ticket}'
          if text.count(raw_read) != 2:
              raise SystemExit(f'expected 2 stale raw-ticket reads, got {text.count(raw_read)}')
          if text.count(query_use) != 2:
              raise SystemExit(f'expected 2 stale ticket query uses, got {text.count(query_use)}')
          path.write_text(text.replace(raw_read, '').replace(query_use, ''))
          PY
          git diff --check

      - name: Commit and self-delete workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm .github/workflows/security-stale-realtime-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: use cookie-backed realtime tickets"
          git push origin HEAD:refs/heads/security/internet-hardening
