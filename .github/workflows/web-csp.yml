name: Web CSP Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'deploy/self-hosted/**'
      - 'docs/security/security-headers-policy.md'
      - 'docs/security/README.md'
      - 'docs/self-hosting.md'
      - 'docs/manual-qa.md'
      - 'README.md'
      - '.github/RELEASE_CHECKLIST.md'
      - '.github/workflows/web-csp.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/frontend/**'
      - 'deploy/self-hosted/**'
      - 'docs/security/security-headers-policy.md'
      - 'docs/security/README.md'
      - 'docs/self-hosting.md'
      - 'docs/manual-qa.md'
      - 'README.md'
      - '.github/RELEASE_CHECKLIST.md'
      - '.github/workflows/web-csp.yml'

permissions:
  contents: read

concurrency:
  group: web-csp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-csp:
    name: Production Nonce CSP
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        run: pnpm --dir apps/frontend lint

      - name: Typecheck web application
        run: pnpm --dir apps/frontend typecheck

      - name: Run web unit tests
        run: pnpm --dir apps/frontend test

      - name: Validate self-hosted Compose wiring
        run: >-
          docker compose
          --env-file deploy/self-hosted/.env.example
          -f deploy/self-hosted/compose.yaml
          config --quiet

      - name: Install Chromium
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: Run production CSP and core-flow browser suite
        run: pnpm --dir apps/frontend test:browser:production

      - name: Upload production browser artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-csp-production-report
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
