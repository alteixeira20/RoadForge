name: Web CSP Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'deploy/self-hosted/**'
      - 'docs/security/security-headers-policy.md'
      - 'docs/security/README.md'
      - 'docs/self-hosting.md'
      - 'docs/manual-qa.md'
      - 'README.md'
      - '.github/RELEASE_CHECKLIST.md'
      - '.github/workflows/web-csp.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/web/**'
      - 'deploy/self-hosted/**'
      - 'docs/security/security-headers-policy.md'
      - 'docs/security/README.md'
      - 'docs/self-hosting.md'
      - 'docs/manual-qa.md'
      - 'README.md'
      - '.github/RELEASE_CHECKLIST.md'
      - '.github/workflows/web-csp.yml'

permissions:
  contents: read

concurrency:
  group: web-csp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-csp:
    name: Production Nonce CSP
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        run: pnpm --dir apps/web lint

      - name: Typecheck web application
        run: pnpm --dir apps/web typecheck

      - name: Run web unit tests
        run: pnpm --dir apps/web test

      - name: Validate self-hosted Compose wiring
        run: >-
          docker compose
          --env-file deploy/self-hosted/.env.example
          -f deploy/self-hosted/compose.yaml
          config --quiet

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run production CSP and core-flow browser suite
        run: pnpm --dir apps/web test:browser:production

      - name: Upload production browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-csp-production-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
