name: Temporary Contributor Foundation Replay

on:
  pull_request:
    branches:
      - dev
      - foundation/release-baseline

permissions:
  contents: write

jobs:
  replay:
    if: >-
      github.head_ref == 'foundation/contributor-experience' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Replay audited contributor files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin foundation/contributor-experience-snapshot
          git checkout FETCH_HEAD -- \
            .github/pull_request_template.md \
            CONTRIBUTING.md \
            GOVERNANCE.md \
            docs/README.md \
            docs/architecture/partial-roadmap-write-endpoints.md \
            docs/architecture/task-partial-write-api.md \
            docs/contributor-guide.md \
            docs/roadforge-roadmap-generator-template.txt \
            docs/ui-control-inventory.md
          rm .github/workflows/replay-contributor-foundation-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/pull_request_template.md \
            CONTRIBUTING.md \
            GOVERNANCE.md \
            docs/README.md \
            docs/architecture/partial-roadmap-write-endpoints.md \
            docs/architecture/task-partial-write-api.md \
            docs/contributor-guide.md \
            docs/roadforge-roadmap-generator-template.txt \
            docs/ui-control-inventory.md \
            .github/workflows/replay-contributor-foundation-temp.yml
          git diff --cached --check
          git commit -m 'docs: establish contributor and documentation foundation'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
