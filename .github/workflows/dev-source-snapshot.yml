name: Dev source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: roadforge-dev-source
          path: |
            apps/api
            apps/web/src
            README.md
            .github/workflows/ci.yml
          retention-days: 1
