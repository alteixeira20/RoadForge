name: Execute corrected Phase 2 application hardening

on:
  push:
    branches:
      - security/internet-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin refs/heads/security/internet-hardening
          git checkout -B security/internet-hardening FETCH_HEAD

      - name: Execute reviewed Phase 2 transformation
        run: |
          python - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-phase2-security.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          python -m compileall"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('Could not locate Phase 2 transform block exactly once')
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'

          old = '''          old = '        ticket = ticket_resp.json()["ticket"]\\n'\n          if text.count(old) != 2:\n              raise SystemExit(f'test_realtime_revocation.py expected 2 raw-ticket extracts, got {text.count(old)}')\n          text = text.replace(old, '')\n          text = text.replace('params={"ticket": ticket},\\n', '', 2)'''
          # The extracted script no longer has the workflow indentation.
          old = old.replace('          ', '').replace('              ', '    ')
          new = '''old = '    ticket = ticket_resp.json()["ticket"]\\n'\nif text.count(old) != 2:\n    raise SystemExit(f'test_realtime_revocation.py expected 2 raw-ticket extracts, got {text.count(old)}')\nif text.count(', params={"ticket": ticket}') != 2:\n    raise SystemExit(f'test_realtime_revocation.py expected 2 raw-ticket query uses, got {text.count(chr(44) + " params={\\"ticket\\": ticket}")}')\ntext = text.replace(old, '')\ntext = text.replace(', params={"ticket": ticket}', '', 2)'''
          if script.count(old) != 1:
              raise SystemExit(f'Expected one stale-test transform block, found {script.count(old)}')
          script = script.replace(old, new)
          Path('/tmp/apply_phase2.py').write_text(script)
          PYEXTRACT
          python -m py_compile /tmp/apply_phase2.py
          python /tmp/apply_phase2.py
          python -m compileall -q apps/api/src/api apps/api/tests/test_browser_session_security.py
          git diff --check

      - name: Commit hardened application layer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f \
            .github/workflows/apply-phase2-security.yml \
            .github/workflows/retry-phase2-security.yml \
            .github/workflows/retry-phase2-security-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: harden browser sessions and rate limits"
          git push origin HEAD:refs/heads/security/internet-hardening
