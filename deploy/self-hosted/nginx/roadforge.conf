log_format roadforge_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent"';

server {
    listen 80;
    server_name roadforge.anvilary.tools;

    # Keep request-target logging credential-safe. New invite credentials use
    # URL fragments (not sent upstream) and SSE tickets use an HttpOnly cookie,
    # but pre-hardening invite links may still arrive as query parameters.
    # Never log query strings or Referer values here.
    access_log /var/log/nginx/roadforge.access.log roadforge_safe;

    # Keep this aligned with apps/api/src/api/schemas/limits.py and the browser
    # import limit. Nginx rejects oversized bodies before they reach Python.
    client_max_body_size 5m;

    # Edge-wide baseline. These values intentionally match the application
    # baseline so duplicate defense-in-depth headers never conflict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # The production API disables OpenAPI and interactive documentation.
    location = /api/docs { return 404; }
    location = /api/redoc { return 404; }
    location = /api/openapi.json { return 404; }

    location ~ ^/api/roadmaps/[^/]+/events$ {
        proxy_pass http://roadforge-api:7878;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://roadforge-api:7878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://roadforge-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
