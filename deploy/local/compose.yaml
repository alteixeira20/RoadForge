name: roadforge-local

services:
  roadforge-web:
    container_name: roadforge-local-web
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:7878}
        NEXT_PUBLIC_TEAM_FEATURES_ENABLED: "false"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      roadforge-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  roadforge-api:
    container_name: roadforge-local-api
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://roadforge:${POSTGRES_PASSWORD:-roadforge_local}@roadforge-postgres:5432/roadforge
      ROADFORGE_ENVIRONMENT: development
      ROADFORGE_WEB_BASE_URL: http://127.0.0.1:3020
      ROADFORGE_CORS_ORIGINS: http://127.0.0.1:3020,http://localhost:3020
      ROADFORGE_REALTIME_BACKEND: memory
      ROADFORGE_API_WORKERS: "1"
    ports:
      - "127.0.0.1:7878:7878"
    depends_on:
      roadforge-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/api/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  roadforge-postgres:
    container_name: roadforge-local-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roadforge
      POSTGRES_USER: roadforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadforge_local}
    volumes:
      - roadforge_local_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadforge -d roadforge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  roadforge_local_postgres:
